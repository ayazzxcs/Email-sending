name: Quvirl GitHub marketing agent

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: quvirl-marketing
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start temporary SearXNG
        run: |
          docker run -d --name searxng \
            -p 127.0.0.1:8080:8080 \
            -v "$GITHUB_WORKSPACE/searxng:/etc/searxng:rw" \
            ghcr.io/searxng/searxng:latest
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs searxng
          exit 1
      - name: Run Quvirl agent
        run: npm run check && npm run discover && npm run draft && npm run queue && npm run send
        env:
          SEARXNG_URL: http://127.0.0.1:8080
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          DAILY_LIMIT: '500'
          BATCH_SIZE: '1000'
          DELAY_SECONDS: '45'
          MAX_QUERIES: '100'
          SEARCH_PAGES: '100'
          MAX_STORES: '500'
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP }}
      - name: Show SearXNG logs on failure
        if: failure()
        run: docker logs searxng || true
      - name: Persist campaign state
        if: always()
        run: |
          git config user.name quvirl-marketing-bot
          git config user.email noreply@quvirl.com
          git add data/
          git diff --cached --quiet || git commit -m 'Update agent state'
          git pull --rebase
          git push
      - name: Upload campaign data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quvirl-agent-data
          path: data/
