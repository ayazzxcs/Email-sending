name: Quvirl GitHub marketing agent

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: quvirl-marketing
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Quvirl agent
        run: npm run check && npm run run
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          DAILY_LIMIT: '500'
          BATCH_SIZE: '25'
          DELAY_SECONDS: '45'
          MAX_QUERIES: '3'
          MAX_STORES: '20'
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP }}

      - name: Persist campaign state
        if: always()
        run: |
          git config user.name quvirl-marketing-bot
          git config user.email noreply@quvirl.com
          git add data/
          git diff --cached --quiet || git commit -m 'Update agent state'
          git pull --rebase
          git push

      - name: Upload campaign data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quvirl-agent-data
          path: data/
